<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar {
            background: linear-gradient(to right, #3a7bd5, #3a6073);
            border-radius: 5px;
            position: fixed;
            top: 0;
            /* height: auto; */
            /* width: 100%; */
            z-index: 1000;
        }

        .btn {
            font-size: 0.8rem;
            font-weight: 700;
            color: white;
            background-color: rgb(63, 3, 119) !important;
        }

        .btn:hover {
            background-color: aliceblue !important;
            color: black !important;
        }

        .btn i {
            vertical-align: text-top;
        }

        #hidden {
            display: none;
        }

        /* .box {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        } */

        .container {
            display: flex;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            padding: 24px;
            /* width: 100vw; */
            /* width: 400px; */
            height: 80vh;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 16px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .upload-area:hover {
            border-color: #3b82f6;
        }

        #image-upload {
            display: none;
        }

        .images {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .process-btn {
            /* background-color: #3b82f6; */
            background-color: rgb(63, 3, 119);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 70%;
            margin-bottom: 16px;
        }

        .process-btn:disabled {
            background-color: #d1d5db;
            cursor: not-allowed;
        }

        .process-btn:hover:not(:disabled) {
            /* background-color: #2563eb; */
            background-color: aliceblue;
            color: black;
            border: 1px solid rgb(0, 133, 249);
        }


        select,
        input[type="range"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        #uploaded-image-container {
            border-radius: 8px;
            width: 200px;
            height: auto;
        }

        #processed-image-container {
            border-radius: 8px;
            width: 200px;
            height: auto;
        }

        .translate:hover {
            transform: scale(1.025);
            border: 1px solid rgb(63, 3, 119);
        }

        .upload-container {
            display: flex;
            width: 50%;
            justify-content: center;
            flex-direction: column;
            /* align-items: center; */
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-self: center;
            gap: 10px;
            width: 100%;
        }

        .img-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #process-screen {
            display: grid;
            grid-template-columns: 1fr 2fr;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <div class="image-container">
